<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bamu Owners — Tracker Map</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./src/css/bamu-owners.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    .app-shell { height: 100vh; overflow: hidden; }
    .main-content { padding: 0; display: flex; flex-direction: column; position: relative; }
    #map { flex: 1; width: 100%; min-height: 0; }
  </style>
</head>
<body>
  <div class="app-shell">
    <!-- SIDEBAR -->
    <aside class="sidebar">
      <div class="sidebar-brand">
        <div class="brand-name">Bamu</div>
        <div class="brand-tagline">Bamu Tracker</div>
      </div>
      <nav class="sidebar-nav">
        <a href="./index.html">
          <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
          Dashboard
        </a>
        <a href="./customers.html">
          <svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          Customers
        </a>
        <a href="./vehicles.html">
          <svg viewBox="0 0 24 24"><rect x="1" y="3" width="15" height="13"/><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg>
          Vehicles
        </a>
        <a href="./trackers.html">
          <svg viewBox="0 0 24 24"><path d="M12 2L3 7v5c0 5.25 3.75 10.15 9 11.25C17.25 22.15 21 17.25 21 12V7L12 2z"/><circle cx="12" cy="12" r="3"/></svg>
          Trackers
        </a>
        <a href="./map.html" class="active">
          <svg viewBox="0 0 24 24"><polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"/><line x1="8" y1="2" x2="8" y2="18"/><line x1="16" y1="6" x2="16" y2="22"/></svg>
          Tracker Map
        </a>
        <a href="./alerts.html">
          <svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
          Alerts
          <span id="alerts-nav-badge" class="nav-badge" style="display:none">0</span>
        </a>
      </nav>
    </aside>

    <!-- MAP + OVERLAY PANEL -->
    <main class="main-content">
      <!-- Floating vehicle list panel -->
      <div class="map-side-panel" id="vehicles-panel">
        <div class="map-side-panel-header">🚗 Vehicles</div>
        <div id="vehicle-list-cards">
          <!-- Populated by JS -->
        </div>
      </div>
      <div id="map"></div>
    </main>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script type="module">
    import { getVehicles, getCustomers, getTrackers, findCustomerById, getTrackerById, getAlerts } from './src/js/storage.js';

    // Nav badge
    const unread = getAlerts().filter(a => !a.read).length;
    const navBadge = document.getElementById('alerts-nav-badge');
    if (navBadge && unread > 0) { navBadge.textContent = unread; navBadge.style.display = 'inline-flex'; }

    const HIJACK_ZONES = [
      { name: 'Diepsloot', coords: [-25.9344, 28.0147], radius: 2000 },
      { name: 'Alexandra Township', coords: [-26.1053, 28.1053], radius: 1500 },
      { name: 'Hillbrow', coords: [-26.1926, 28.0470], radius: 1000 },
      { name: 'Johannesburg CBD', coords: [-26.2041, 28.0473], radius: 1800 },
      { name: 'Soweto Corridor', coords: [-26.2672, 27.8584], radius: 2500 },
    ];

    const STOLEN_ZONES = [
      { name: 'Pretoria West Recovery Zone', coords: [-25.7463, 28.1883], radius: 2200 },
      { name: 'East Rand Recovery Zone', coords: [-26.2305, 28.2205], radius: 2800 },
      { name: 'Krugersdorp Area', coords: [-26.0991, 27.7673], radius: 1800 },
    ];

    const STATUS_COLORS = {
      parked: '#059669',
      moving: '#1D4ED8',
      offline: '#9CA3AF',
      alert: '#DC2626',
    };

    const STATUS_LABELS = {
      parked: '🟢 Parked',
      moving: '🔵 Moving',
      offline: '⚫ Offline',
      alert: '🔴 Alert',
    };

    document.addEventListener('DOMContentLoaded', () => {
      const vehicles = getVehicles();
      const map = L.map('map').setView([-26.0, 28.0], 10);

      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
        maxZoom: 19,
      }).addTo(map);

      // Hijacking zones
      HIJACK_ZONES.forEach(zone => {
        L.circle(zone.coords, {
          radius: zone.radius,
          color: '#DC2626',
          fillColor: '#DC2626',
          fillOpacity: 0.15,
          weight: 2,
        }).addTo(map).bindPopup(`<b>⚠️ Hijacking Hotspot</b><br>${zone.name}`);
      });

      // Stolen zones
      STOLEN_ZONES.forEach(zone => {
        L.circle(zone.coords, {
          radius: zone.radius,
          color: '#D97706',
          fillColor: '#F59E0B',
          fillOpacity: 0.12,
          weight: 2,
        }).addTo(map).bindPopup(`<b>🔶 Recovery Zone</b><br>${zone.name}`);
      });

      // Vehicle markers
      const markers = {};
      vehicles.forEach(v => {
        if (!v.lat || !v.lng) return;
        const color = STATUS_COLORS[v.status] || '#9CA3AF';
        const customer = v.customerId ? findCustomerById(v.customerId) : null;
        const tracker = v.trackerId ? getTrackerById(v.trackerId) : null;

        const markerHtml = `
          <div style="
            width: 20px; height: 20px; border-radius: 50%;
            background: ${color};
            border: 3px solid white;
            box-shadow: 0 0 0 2px ${color}, 0 2px 6px rgba(0,0,0,0.3);
          "></div>
        `;

        const icon = L.divIcon({
          html: markerHtml,
          className: '',
          iconSize: [20, 20],
          iconAnchor: [10, 10],
        });

        const marker = L.marker([v.lat, v.lng], { icon })
          .addTo(map)
          .bindPopup(`
            <div style="font-family:Inter,sans-serif;min-width:200px;">
              <b style="font-size:15px;">${v.make} ${v.model} ${v.year}</b><br>
              <span style="font-family:monospace;font-size:13px;font-weight:700;">${v.plate}</span>
              <span style="background:${color};color:white;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:600;margin-left:8px;">
                ${v.status.charAt(0).toUpperCase() + v.status.slice(1)}
              </span>
              <br><br>
              <table style="font-size:13px;width:100%;border-collapse:collapse;">
                <tr><td style="color:#374151;padding:2px 0">Speed</td><td style="font-weight:600">${v.speed} km/h</td></tr>
                <tr><td style="color:#374151;padding:2px 0">Battery</td><td style="font-weight:600">${v.battery}%</td></tr>
                <tr><td style="color:#374151;padding:2px 0">Customer</td><td style="font-weight:600">${customer ? customer.name : 'Unassigned'}</td></tr>
                ${tracker ? `<tr><td style="color:#374151;padding:2px 0">Tracker</td><td style="font-weight:600;font-family:monospace;font-size:12px">${tracker.serialNumber}</td></tr>` : ''}
              </table>
            </div>
          `);

        markers[v.id] = marker;
      });

      // Vehicle list panel
      const listEl = document.getElementById('vehicle-list-cards');
      if (vehicles.length === 0) {
        listEl.innerHTML = `<div style="padding:14px;color:var(--text-muted);font-size:13px;">No vehicles registered.</div>`;
      } else {
        listEl.innerHTML = vehicles.map(v => {
          const color = STATUS_COLORS[v.status] || '#9CA3AF';
          const customer = v.customerId ? findCustomerById(v.customerId) : null;
          return `
            <div class="map-vehicle-card" data-vid="${v.id}">
              <div style="display:flex;align-items:center;gap:8px;">
                <div style="width:10px;height:10px;border-radius:50%;background:${color};flex-shrink:0;"></div>
                <div class="map-vehicle-plate">${v.plate}</div>
              </div>
              <div class="map-vehicle-name">${v.make} ${v.model} · ${v.speed} km/h</div>
              ${customer ? `<div style="font-size:11px;color:var(--text-muted);margin-top:1px;">${customer.name}</div>` : ''}
            </div>
          `;
        }).join('');

        listEl.querySelectorAll('.map-vehicle-card').forEach(card => {
          card.addEventListener('click', () => {
            const marker = markers[card.dataset.vid];
            if (marker) {
              map.setView(marker.getLatLng(), 14);
              marker.openPopup();
            }
          });
        });
      }

      // Legend
      const legend = L.control({ position: 'bottomright' });
      legend.onAdd = () => {
        const div = L.DomUtil.create('div', 'map-legend');
        div.innerHTML = `
          <h4>Map Legend</h4>
          <div class="legend-item"><div class="legend-dot" style="background:#059669"></div>Parked</div>
          <div class="legend-item"><div class="legend-dot" style="background:#1D4ED8"></div>Moving</div>
          <div class="legend-item"><div class="legend-dot" style="background:#DC2626"></div>Alert</div>
          <div class="legend-item"><div class="legend-dot" style="background:#9CA3AF"></div>Offline</div>
          <div style="border-top:1px solid #E5E7EB;margin:8px 0;"></div>
          <div class="legend-item"><div class="legend-dot" style="background:rgba(220,38,38,0.3);border:1.5px solid #DC2626;border-radius:0;width:14px;height:14px;"></div>Hijacking Zone</div>
          <div class="legend-item"><div class="legend-dot" style="background:rgba(245,158,11,0.25);border:1.5px solid #D97706;border-radius:0;width:14px;height:14px;"></div>Recovery Zone</div>
        `;
        return div;
      };
      legend.addTo(map);
    });
  </script>
</body>
</html>
