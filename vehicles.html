<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bamu Owners — Vehicles</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./src/css/bamu-owners.css">
</head>
<body>
  <div class="app-shell">
    <!-- SIDEBAR -->
    <aside class="sidebar">
      <div class="sidebar-brand">
        <div class="brand-name">Bamu</div>
        <div class="brand-tagline">Owners Dashboard</div>
      </div>
      <nav class="sidebar-nav">
        <a href="./index.html">
          <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
          Fleet Dashboard
        </a>
        <a href="./customers.html">
          <svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          Customers
        </a>
        <a href="./vehicles.html" class="active">
          <svg viewBox="0 0 24 24"><rect x="1" y="3" width="15" height="13"/><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg>
          Vehicles
        </a>
        <a href="./trackers.html">
          <svg viewBox="0 0 24 24"><path d="M12 2L3 7v5c0 5.25 3.75 10.15 9 11.25C17.25 22.15 21 17.25 21 12V7L12 2z"/><circle cx="12" cy="12" r="3"/></svg>
          Trackers
        </a>
        <a href="./map.html">
          <svg viewBox="0 0 24 24"><polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"/><line x1="8" y1="2" x2="8" y2="18"/><line x1="16" y1="6" x2="16" y2="22"/></svg>
          Fleet Map
        </a>
        <a href="./alerts.html">
          <svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
          Alerts
          <span id="alerts-nav-badge" class="nav-badge" style="display:none">0</span>
        </a>
      </nav>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="main-content">
      <div class="page-header">
        <div class="page-header-left">
          <h1>Vehicles</h1>
          <p>Manage your entire vehicle fleet</p>
        </div>
        <button id="add-vehicle-btn" class="btn btn-primary">
          <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          Add Vehicle
        </button>
      </div>

      <div class="table-container">
        <table class="data-table">
          <thead>
            <tr>
              <th>Vehicle</th>
              <th>Plate</th>
              <th>Status</th>
              <th>Customer</th>
              <th>Tracker</th>
              <th>Battery</th>
              <th style="text-align:right">Actions</th>
            </tr>
          </thead>
          <tbody id="vehicles-tbody">
            <!-- Populated by JS -->
          </tbody>
        </table>
      </div>
    </main>
  </div>

  <!-- ADD/EDIT VEHICLE MODAL -->
  <dialog id="vehicle-modal">
    <div class="modal-header">
      <h2 id="modal-title">Add Vehicle</h2>
      <button class="modal-close-btn" id="modal-close">✕</button>
    </div>
    <div class="modal-body">
      <form id="vehicle-form" novalidate>
        <input type="hidden" id="edit-id" value="">
        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="f-make">Make <span class="required">*</span></label>
            <input type="text" id="f-make" class="form-input" placeholder="Toyota" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="f-model">Model <span class="required">*</span></label>
            <input type="text" id="f-model" class="form-input" placeholder="Fortuner" required>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="f-year">Year</label>
            <input type="number" id="f-year" class="form-input" placeholder="2022" min="2000" max="2030">
          </div>
          <div class="form-group">
            <label class="form-label" for="f-color">Color</label>
            <input type="text" id="f-color" class="form-input" placeholder="Pearl White">
          </div>
        </div>
        <div class="form-group">
          <label class="form-label" for="f-plate">License Plate <span class="required">*</span></label>
          <input type="text" id="f-plate" class="form-input" placeholder="GP 123-456" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="f-customer">Assign to Customer</label>
          <select id="f-customer" class="form-select">
            <option value="">— Unassigned —</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label" for="f-tracker">Assign Tracker</label>
          <select id="f-tracker" class="form-select">
            <option value="">— No Tracker —</option>
          </select>
        </div>
        <div id="form-error" style="color:var(--danger);font-size:13px;margin-top:4px;display:none;"></div>
      </form>
    </div>
    <div class="modal-footer">
      <button type="button" class="btn btn-secondary" id="modal-cancel">Cancel</button>
      <button type="button" class="btn btn-primary" id="modal-save">Save Vehicle</button>
    </div>
  </dialog>

  <script type="module">
    import {
      getVehicles, addVehicle, updateVehicle, deleteVehicle,
      getCustomers, getTrackers, updateTracker, findCustomerById, getTrackerById, getAlerts
    } from './src/js/storage.js';

    // Nav badge
    const unread = getAlerts().filter(a => !a.read).length;
    const navBadge = document.getElementById('alerts-nav-badge');
    if (navBadge && unread > 0) { navBadge.textContent = unread; navBadge.style.display = 'inline-flex'; }

    function getBatteryBarHtml(pct) {
      const cls = pct >= 50 ? 'high' : pct >= 20 ? 'mid' : 'low';
      return `<div class="battery-bar-track"><div class="battery-bar-fill ${cls}" style="width:${pct}%"></div></div> ${pct}%`;
    }

    function renderTable() {
      const vehicles = getVehicles();
      const tbody = document.getElementById('vehicles-tbody');
      const statusBadge = { parked: 'badge-parked', moving: 'badge-moving', offline: 'badge-offline', alert: 'badge-alert' };

      if (vehicles.length === 0) {
        tbody.innerHTML = `<tr class="table-empty"><td colspan="7">No vehicles registered yet.</td></tr>`;
        return;
      }

      tbody.innerHTML = vehicles.map(v => {
        const customer = v.customerId ? findCustomerById(v.customerId) : null;
        const tracker = v.trackerId ? getTrackerById(v.trackerId) : null;
        return `
          <tr>
            <td>
              <strong>${v.make} ${v.model}</strong>
              <div style="font-size:12px;color:var(--text-muted)">${v.year || ''} · ${v.color || ''}</div>
            </td>
            <td style="font-family:monospace;font-weight:700;">${v.plate}</td>
            <td><span class="badge ${statusBadge[v.status] || 'badge-muted'}">${v.status.charAt(0).toUpperCase() + v.status.slice(1)}</span></td>
            <td>${customer ? customer.name : '<span style="color:var(--text-muted)">Unassigned</span>'}</td>
            <td>${tracker ? `<span style="font-family:monospace;font-size:12px">${tracker.serialNumber}</span>` : '<span style="color:var(--text-muted)">None</span>'}</td>
            <td style="white-space:nowrap">${getBatteryBarHtml(v.battery || 0)}</td>
            <td>
              <div class="table-actions">
                <button class="btn btn-ghost btn-xs edit-btn" data-id="${v.id}">Edit</button>
                <button class="btn btn-ghost-danger btn-xs delete-btn" data-id="${v.id}">Delete</button>
              </div>
            </td>
          </tr>
        `;
      }).join('');

      tbody.querySelectorAll('.edit-btn').forEach(btn => btn.addEventListener('click', () => openEditModal(btn.dataset.id)));
      tbody.querySelectorAll('.delete-btn').forEach(btn => btn.addEventListener('click', () => {
        if (confirm('Delete this vehicle?')) { deleteVehicle(btn.dataset.id); renderTable(); }
      }));
    }

    function populateDropdowns(currentVehicleId) {
      // Customer dropdown
      const custSel = document.getElementById('f-customer');
      const customers = getCustomers();
      const existingCustomerOpts = customers.map(c =>
        `<option value="${c.id}">${c.name} (${c.email})</option>`
      ).join('');
      custSel.innerHTML = `<option value="">— Unassigned —</option>${existingCustomerOpts}`;

      // Tracker dropdown: show unassigned + the one currently assigned to THIS vehicle
      const trackerSel = document.getElementById('f-tracker');
      const trackers = getTrackers();
      const available = trackers.filter(t => t.vehicleId === null || t.vehicleId === currentVehicleId);
      trackerSel.innerHTML = `<option value="">— No Tracker —</option>` +
        available.map(t => `<option value="${t.id}">${t.serialNumber} (${t.brand}) — ${t.status}</option>`).join('');
    }

    const modal = document.getElementById('vehicle-modal');

    function openAddModal() {
      document.getElementById('modal-title').textContent = 'Add Vehicle';
      document.getElementById('edit-id').value = '';
      document.getElementById('vehicle-form').reset();
      document.getElementById('form-error').style.display = 'none';
      populateDropdowns(null);
      modal.showModal();
    }

    function openEditModal(id) {
      const v = getVehicles().find(x => x.id === id);
      if (!v) return;
      document.getElementById('modal-title').textContent = 'Edit Vehicle';
      document.getElementById('edit-id').value = v.id;
      document.getElementById('f-make').value = v.make;
      document.getElementById('f-model').value = v.model;
      document.getElementById('f-year').value = v.year || '';
      document.getElementById('f-color').value = v.color || '';
      document.getElementById('f-plate').value = v.plate;
      document.getElementById('form-error').style.display = 'none';
      populateDropdowns(v.id);
      document.getElementById('f-customer').value = v.customerId || '';
      document.getElementById('f-tracker').value = v.trackerId || '';
      modal.showModal();
    }

    function closeModal() { modal.close(); }

    document.getElementById('add-vehicle-btn').addEventListener('click', openAddModal);
    document.getElementById('modal-close').addEventListener('click', closeModal);
    document.getElementById('modal-cancel').addEventListener('click', closeModal);

    document.getElementById('modal-save').addEventListener('click', () => {
      const make = document.getElementById('f-make').value.trim();
      const model = document.getElementById('f-model').value.trim();
      const year = parseInt(document.getElementById('f-year').value) || null;
      const color = document.getElementById('f-color').value.trim();
      const plate = document.getElementById('f-plate').value.trim();
      const customerId = document.getElementById('f-customer').value || null;
      const trackerId = document.getElementById('f-tracker').value || null;
      const editId = document.getElementById('edit-id').value;
      const errEl = document.getElementById('form-error');

      if (!make || !model || !plate) {
        errEl.textContent = 'Make, Model and Plate are required.';
        errEl.style.display = 'block';
        return;
      }

      const data = { make, model, year, color, plate, customerId, trackerId };

      if (editId) {
        const old = getVehicles().find(v => v.id === editId);
        // Unassign old tracker if changed
        if (old?.trackerId && old.trackerId !== trackerId) {
          updateTracker(old.trackerId, { vehicleId: null, status: 'unassigned' });
        }
        updateVehicle(editId, data);
        // Assign new tracker to this vehicle
        if (trackerId) {
          updateTracker(trackerId, { vehicleId: editId, status: 'active' });
        }
      } else {
        const newVehicle = addVehicle(data);
        // Assign tracker to new vehicle
        if (trackerId) {
          updateTracker(trackerId, { vehicleId: newVehicle.id, status: 'active' });
        }
      }

      closeModal();
      renderTable();
    });

    document.addEventListener('DOMContentLoaded', renderTable);
  </script>
</body>
</html>
