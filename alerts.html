<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bamu Owners — Alerts</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./src/css/bamu-owners.css">
</head>
<body>
  <div class="app-shell">
    <!-- SIDEBAR -->
    <aside class="sidebar">
      <div class="sidebar-brand">
        <div class="brand-name">Bamu</div>
        <div class="brand-tagline">Bamu Tracker</div>
      </div>
      <nav class="sidebar-nav">
        <a href="./index.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></svg>
          Dashboard
        </a>
        <a href="./customers.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          Customers
        </a>
        <a href="./vehicles.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="1" y="3" width="15" height="13" rx="2"/><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg>
          Vehicles
        </a>
        <a href="./trackers.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L3 7v5c0 5.25 3.75 10.15 9 11.25C17.25 22.15 21 17.25 21 12V7L12 2z"/><circle cx="12" cy="12" r="3"/></svg>
          Trackers
        </a>
        <a href="./map.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"/><line x1="8" y1="2" x2="8" y2="18"/><line x1="16" y1="6" x2="16" y2="22"/></svg>
          Tracker Map
        </a>
        <a href="./alerts.html" class="active">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
          Alerts
          <span id="alerts-nav-badge" class="nav-badge" style="display:none">0</span>
        </a>
      </nav>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="main-content">
      <div class="page-header">
        <div class="page-header-left">
          <h1>Alerts</h1>
          <p>System notifications for all vehicles</p>
        </div>
        <div style="display:flex;gap:10px">
          <button id="mark-all-btn" class="btn btn-secondary">Mark All Read</button>
          <button id="clear-read-btn" class="btn btn-secondary" style="color:var(--danger)">Clear Read</button>
        </div>
      </div>

      <!-- Filter bar -->
      <div class="filter-bar" style="display:flex;gap:12px;margin-bottom:20px;flex-wrap:wrap;align-items:center">
        <select id="filter-type" class="form-input" style="max-width:180px">
          <option value="">All Types</option>
          <option value="hijack-zone">Hijack Zone</option>
          <option value="speeding">Speeding</option>
          <option value="stolen-zone">Stolen Zone</option>
          <option value="geofence">Geofence</option>
          <option value="offline">Offline</option>
        </select>
        <select id="filter-vehicle" class="form-input" style="max-width:220px">
          <option value="">All Vehicles</option>
        </select>
        <select id="filter-status" class="form-input" style="max-width:150px">
          <option value="">All Statuses</option>
          <option value="unread">Unread only</option>
          <option value="read">Read only</option>
        </select>
        <span id="alert-count" style="margin-left:auto;font-size:13px;color:var(--text-muted)"></span>
      </div>

      <div class="table-container">
        <table class="data-table" id="alerts-table">
          <thead>
            <tr>
              <th width="160">Time</th>
              <th>Type</th>
              <th>Vehicle</th>
              <th>Customer</th>
              <th>Message</th>
              <th width="120" style="text-align:right">Actions</th>
            </tr>
          </thead>
          <tbody id="alerts-tbody"></tbody>
        </table>
        <div id="alerts-empty" class="empty-state" style="display:none">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="48" height="48"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
          <h3>No alerts</h3>
          <p>Your fleet is running smoothly — no notifications to show.</p>
        </div>
      </div>
    </main>
  </div>

  <script type="module">
    import {
      getAlerts, markAlertRead, deleteAlert,
      getVehicles, getVehicleById,
      getCustomers, findCustomerById
    } from './src/js/storage.js';

    const TYPE_CONFIG = {
      'hijack-zone': { label: 'Hijack Zone', cls: 'danger', icon: '⚠' },
      'speeding':    { label: 'Speeding',    cls: 'warning', icon: '⚡' },
      'stolen-zone': { label: 'Stolen Zone', cls: 'warning', icon: '🔍' },
      'geofence':    { label: 'Geofence',    cls: 'info',    icon: '📍' },
      'offline':     { label: 'Offline',     cls: 'secondary', icon: '📵' },
    };

    function relativeTime(iso) {
      if (!iso) return '—';
      const diff = (Date.now() - new Date(iso).getTime()) / 1000;
      if (diff < 60) return 'Just now';
      if (diff < 3600) return `${Math.floor(diff/60)}m ago`;
      if (diff < 86400) return `${Math.floor(diff/3600)}h ago`;
      return `${Math.floor(diff/86400)}d ago`;
    }

    function populateVehicleFilter() {
      const sel = document.getElementById('filter-vehicle');
      sel.innerHTML = '<option value="">All Vehicles</option>';
      getVehicles().forEach(v => {
        const opt = document.createElement('option');
        opt.value = v.id;
        opt.textContent = `${v.make} ${v.model} (${v.plate})`;
        sel.appendChild(opt);
      });
    }

    function renderTable() {
      const typeFilter = document.getElementById('filter-type').value;
      const vehicleFilter = document.getElementById('filter-vehicle').value;
      const statusFilter = document.getElementById('filter-status').value;

      let alerts = getAlerts().sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
      if (typeFilter) alerts = alerts.filter(a => a.type === typeFilter);
      if (vehicleFilter) alerts = alerts.filter(a => a.vehicleId === vehicleFilter);
      if (statusFilter === 'unread') alerts = alerts.filter(a => !a.read);
      if (statusFilter === 'read') alerts = alerts.filter(a => a.read);

      const tbody = document.getElementById('alerts-tbody');
      const empty = document.getElementById('alerts-empty');
      const table = document.getElementById('alerts-table');
      const countEl = document.getElementById('alert-count');

      const unreadCount = getAlerts().filter(a => !a.read).length;
      const badge = document.getElementById('alerts-nav-badge');
      if (unreadCount > 0) { badge.textContent = unreadCount; badge.style.display = 'inline-flex'; }
      else badge.style.display = 'none';

      countEl.textContent = `${alerts.length} alert${alerts.length !== 1 ? 's' : ''} shown`;

      if (!alerts.length) {
        tbody.innerHTML = '';
        table.style.display = 'none';
        empty.style.display = 'flex';
        return;
      }
      table.style.display = '';
      empty.style.display = 'none';

      tbody.innerHTML = alerts.map(a => {
        const tc = TYPE_CONFIG[a.type] || { label: a.type, cls: 'secondary', icon: '●' };
        const vehicle = a.vehicleId ? getVehicleById(a.vehicleId) : null;
        const customer = a.customerId ? findCustomerById(a.customerId) : null;
        const rowStyle = !a.read ? 'background:var(--primary-light);' : '';
        return `
          <tr style="${rowStyle}">
            <td style="font-size:13px;color:var(--text-muted);white-space:nowrap">
              <span title="${a.timestamp}">${relativeTime(a.timestamp)}</span>
            </td>
            <td>
              <span class="badge badge-${tc.cls}" style="gap:4px">
                ${tc.icon} ${tc.label}
              </span>
              ${!a.read ? '<span style="width:7px;height:7px;border-radius:50%;background:var(--danger);display:inline-block;margin-left:4px;vertical-align:middle" title="Unread"></span>' : ''}
            </td>
            <td style="font-size:13px">
              ${vehicle ? `<strong>${vehicle.make} ${vehicle.model}</strong><br><span style="color:var(--text-muted)">${vehicle.plate}</span>` : '<span style="color:var(--text-muted)">—</span>'}
            </td>
            <td style="font-size:13px">
              ${customer ? customer.name : '<span style="color:var(--text-muted)">—</span>'}
            </td>
            <td style="font-size:14px">${a.message}</td>
            <td>
              <div style="display:flex;justify-content:flex-end;gap:6px">
                ${!a.read ? `<button class="btn btn-sm btn-secondary" onclick="readAlert('${a.id}')">✓ Read</button>` : ''}
                <button class="btn btn-sm btn-danger" onclick="removeAlert('${a.id}')">Delete</button>
              </div>
            </td>
          </tr>`;
      }).join('');
    }

    window.readAlert = (id) => { markAlertRead(id); renderTable(); };
    window.removeAlert = (id) => {
      if (!confirm('Delete this alert?')) return;
      deleteAlert(id);
      renderTable();
    };

    document.getElementById('mark-all-btn').addEventListener('click', () => {
      getAlerts().filter(a => !a.read).forEach(a => markAlertRead(a.id));
      renderTable();
    });

    document.getElementById('clear-read-btn').addEventListener('click', () => {
      if (!confirm('Delete all read alerts?')) return;
      getAlerts().filter(a => a.read).forEach(a => deleteAlert(a.id));
      renderTable();
    });

    ['filter-type','filter-vehicle','filter-status'].forEach(id =>
      document.getElementById(id).addEventListener('change', renderTable)
    );

    populateVehicleFilter();
    renderTable();
  </script>
</body>
</html>
