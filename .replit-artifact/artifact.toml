kind = "web"
previewPath = "/owners/"
title = "Bamu — Owners Dashboard"
version = "1.0.0"
id = "artifacts/bamu-owners"
router = "path"

[[services]]
name = "web"
paths = [ "/owners/" ]
localPort = 21664

[services.development]
run = "pnpm --filter @workspace/bamu-owners run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/bamu-owners", "run", "build" ]
serve = "static"
publicDir = "artifacts/bamu-owners/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21664"
BASE_PATH = "/owners/"
